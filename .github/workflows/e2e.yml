name: e2e
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kind:
    name: kind + KubeVirt ${{ matrix.kubevirt }} (emulation)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - kubevirt: v1.9.1
            node_image: kindest/node:v1.34.11
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.1
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - name: Run the e2e
        env:
          KUBEVIRT_VERSION: ${{ matrix.kubevirt }}
          KIND_NODE_IMAGE: ${{ matrix.node_image }}
        run: test/e2e/run.sh
