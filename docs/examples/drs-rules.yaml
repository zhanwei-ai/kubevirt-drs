groups:
  # Every input is a raw KubeVirt metric (virt-handler, label set name/namespace/node). The rules do not
  # depend on KubeVirt's own vmi:kubevirt_vmi_* recording rules, which exist only when the KubeVirt CR sets
  # monitorNamespace and have been renamed between releases. Rules in one group evaluate in order, so a
  # rule may use the ones above it. See docs/scoring.md.
  - name: kubevirt-drs.score
    interval: 1m
    rules:
      # ---- layer 1: per-VM suffering components, each 0..1, keyed by (name, namespace, node) ----
      - record: vmi:drs_vcpu:count
        expr: count by (name, namespace, node) (kubevirt_vmi_vcpu_seconds_total)
      # share of time the VM's vCPUs spent runnable but waiting for a host core = VMware "CPU ready".
      # kubevirt_vmi_vcpu_delay_seconds_total is libvirt's per-vCPU run_delay; no guest agent needed.
      - record: vmi:drs_cpu_ready:ratio
        expr: |
          sum by (name, namespace, node) (rate(kubevirt_vmi_vcpu_delay_seconds_total[5m]))
          / on (name, namespace, node) vmi:drs_vcpu:count
      # share of the guest's memory the balloon has taken back (host-caused reclaim).
      - record: vmi:drs_mem_reclaim:ratio
        expr: |
          clamp_min(
            1 - sum by (name, namespace, node) (kubevirt_vmi_memory_actual_balloon_bytes)
                / sum by (name, namespace, node) (kubevirt_vmi_memory_domain_bytes)
          , 0)
      # guest swap traffic, 1.0 at swapBytesPerSecondFull.
      - record: vmi:drs_swap:ratio
        expr: |
          clamp_max(
            ( sum by (name, namespace, node) (rate(kubevirt_vmi_memory_swap_in_traffic_bytes[5m]))
            + sum by (name, namespace, node) (rate(kubevirt_vmi_memory_swap_out_traffic_bytes[5m])) )
            / 1.048576e+07
          , 1)
      # guest major page faults, 1.0 at pgmajfaultsPerSecondFull.
      - record: vmi:drs_pgmajfault:ratio
        expr: |
          clamp_max(
            sum by (name, namespace, node) (rate(kubevirt_vmi_memory_pgmajfault_total[5m]))
            / 50
          , 1)
      # memory pressure = reclaim + swap + page faults, capped at 1. Swap / faults may have no series for a
      # VM; "or reclaim * 0" substitutes 0 so the sum does not vanish.
      - record: vmi:drs_mem_pressure:ratio
        expr: |
          clamp_max(
            vmi:drs_mem_reclaim:ratio
            + (vmi:drs_swap:ratio or vmi:drs_mem_reclaim:ratio * 0)
            + (vmi:drs_pgmajfault:ratio or vmi:drs_mem_reclaim:ratio * 0)
          , 1)
      # dropped share of all packets; denominator clamped to 1 pkt/s so an idle VM is 0, not NaN.
      - record: vmi:drs_net_drop:ratio
        expr: |
          sum by (name, namespace, node) (
              rate(kubevirt_vmi_network_receive_packets_dropped_total[5m])
            + rate(kubevirt_vmi_network_transmit_packets_dropped_total[5m])
          )
          / clamp_min(sum by (name, namespace, node) (
              rate(kubevirt_vmi_network_receive_packets_total[5m])
            + rate(kubevirt_vmi_network_transmit_packets_total[5m])
          ), 1)
      # ---- layer 2: the VM score 0..100; efficiencies multiplied, like VMware's VM DRS Score ----
      - record: vmi:drs_score
        expr: |
          100
          * clamp_min(1 - 4 * vmi:drs_cpu_ready:ratio, 0)
          * (1 - (vmi:drs_mem_pressure:ratio or vmi:drs_cpu_ready:ratio * 0))
          * (1 - (vmi:drs_net_drop:ratio or vmi:drs_cpu_ready:ratio * 0))
      # ---- layer 3: node and cluster aggregates, vCPU-weighted (VMware's cluster score is weighted too) ----
      - record: node:drs_score:avg
        expr: |
          sum by (node) (vmi:drs_score * on (name, namespace, node) vmi:drs_vcpu:count)
          / sum by (node) (vmi:drs_vcpu:count)
      - record: cluster:drs_score:avg
        expr: |
          sum(vmi:drs_score * on (name, namespace, node) vmi:drs_vcpu:count)
          / sum(vmi:drs_vcpu:count)
