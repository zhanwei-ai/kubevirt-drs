    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: DRSPolicy is the cluster-wide configuration of the DRS brain.
          It is a singleton named "default".
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DRSPolicySpec configures the one DRS brain of a cluster.
            properties:
              automationLevel:
                default: Manual
                description: |-
                  AutomationLevel is who presses the button, mirroring vSphere DRS. There is no PartiallyAutomated level:
                  initial placement is always automatic in Kubernetes (kube-scheduler), so it would equal Manual.
                enum:
                - Manual
                - FullyAutomated
                type: string
              concurrency:
                description: |-
                  ConcurrencySpec caps the in-flight migrations the brain tolerates before it stops acting for the cycle. It
                  counts EVERY VirtualMachineInstanceMigration that is not finished, not only its own. Unset values are read
                  from the KubeVirt CR (spec.configuration.migrations.parallelMigrationsPerCluster and
                  parallelOutboundMigrationsPerNode; upstream defaults 5 and 2).
                properties:
                  cluster:
                    format: int32
                    minimum: 1
                    type: integer
                  perNode:
                    format: int32
                    minimum: 1
                    type: integer
                type: object
              cooldown:
                description: |-
                  CooldownSpec keeps the brain from moving the same VM again and again. Three layers, each can only raise
                  the effective cooldown (same shape as OpenShift's KubevirtMigrationAware plugin): the base is the larger
                  of Base and the duration of the VM's last migration; it doubles for every further migration completed
                  inside HistoryWindow; it is capped at Max. The last migration is read from the VMI's
                  status.migrationState, so a migration started by anyone (a drain, a descheduler) counts too.
                properties:
                  base:
                    default: 15m
                    type: string
                  historyWindow:
                    default: 48h
                    type: string
                  max:
                    default: 6h
                    type: string
                type: object
              cycleInterval:
                default: 60s
                description: 'CycleInterval is how often the brain runs a collect
                  / decide / act cycle. VMware DRS: one minute.'
                type: string
              migrationThreshold:
                default: Default
                description: |-
                  MigrationThreshold is how much predicted improvement (score points, 0..100) a move must bring to be worth
                  a live migration, and below which score a VM is a candidate at all. See planner.Levels for the numbers.
                enum:
                - Conservative
                - Default
                - Aggressive
                type: string
              paused:
                description: 'Paused: keep scoring and expiring, but create no recommendation
                  and apply nothing. Emergency brake.'
                type: boolean
              recommendationTTL:
                default: 10m
                description: |-
                  RecommendationTTL: an unapproved recommendation older than this is marked Expired and the VM is
                  re-evaluated next cycle (VMware regenerates its recommendations every round too).
                type: string
              scoreAnnotation:
                default: true
                description: |-
                  ScoreAnnotation: write the current score to the VMI annotation drs.zhanwei.ai/score (only when it
                  crosses a 5-point bucket). Turn off on large clusters to save VMI watch traffic.
                type: boolean
              scoring:
                description: |-
                  ScoringSpec holds the decisions the planner takes on top of the Prometheus score. The score formula itself
                  (weights, windows) lives in the PrometheusRule the chart ships; see docs/scoring.md.
                properties:
                  hostCausedCPUReadyPercent:
                    default: 5
                    description: |-
                      HostCausedCPUReadyPercent: a VM whose vCPUs wait for a host core less than this share of the time is
                      not suffering from CPU contention on the host. Together with HostCausedReclaimPercent: below both, a
                      low score comes from inside the guest (its own RAM or IO) and moving it would not help, so the
                      planner skips it. This filter is the main difference to a node-utilization descheduler.
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                  hostCausedReclaimPercent:
                    default: 10
                    description: 'HostCausedReclaimPercent: share of the guest''s
                      memory the balloon has taken back.'
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                  smoothingWindow:
                    default: 5m
                    description: SmoothingWindow is the avg_over_time window applied
                      to the score before any decision.
                    type: string
                type: object
              selector:
                description: SelectorSpec narrows which VMs the brain may move. Both
                  empty = every running VMI.
                properties:
                  namespaceSelector:
                    description: |-
                      A label selector is a label query over a set of resources. The result of matchLabels and
                      matchExpressions are ANDed. An empty label selector matches all objects. A null
                      label selector matches no objects.
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector
                          requirements. The requirements are ANDed.
                        items:
                          description: |-
                            A label selector requirement is a selector that contains values, a key, and an operator that
                            relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
                                merge patch.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions, whose key field is "key", the
                          operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                  vmSelector:
                    description: |-
                      A label selector is a label query over a set of resources. The result of matchLabels and
                      matchExpressions are ANDed. An empty label selector matches all objects. A null
                      label selector matches no objects.
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector
                          requirements. The requirements are ANDed.
                        items:
                          description: |-
                            A label selector requirement is a selector that contains values, a key, and an operator that
                            relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
                                merge patch.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions, whose key field is "key", the
                          operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                type: object
              softTainter:
                default: false
                description: |-
                  SoftTainter: put a PreferNoSchedule taint on nodes the brain considers hot so kube-scheduler also
                  avoids them for new VMs, and as the fallback when a pinned target turns out not to fit.
                type: boolean
            type: object
          status:
            description: DRSPolicyStatus reports what the brain saw in its last cycle.
            properties:
              clusterScore:
                description: ClusterScore is the vCPU-weighted average score of all
                  running VMs, 0..100, as of the last cycle.
                format: int32
                type: integer
              conditions:
                description: 'Conditions: Ready, PrometheusReachable, ScoreRuleLoaded,
                  KubeVirtAvailable, ExternalEvacuationsDetected.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              inFlightMigrations:
                format: int32
                type: integer
              lastCycleDuration:
                type: string
              lastCycleTime:
                format: date-time
                type: string
              observedGeneration:
                format: int64
                type: integer
              pendingRecommendations:
                format: int32
                type: integer
            type: object
        type: object
        x-kubernetes-validations:
        - message: 'DRSPolicy is a singleton: the only allowed name is ''default'''
          rule: self.metadata.name == 'default'
    served: true
    storage: true
    subresources:
      status: {}
