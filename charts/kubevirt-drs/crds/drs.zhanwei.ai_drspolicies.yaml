---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: drspolicies.drs.zhanwei.ai
spec:
  group: drs.zhanwei.ai
  names:
    kind: DRSPolicy
    listKind: DRSPolicyList
    plural: drspolicies
    shortNames:
    - drsp
    singular: drspolicy
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.automationLevel
      name: Automation
      type: string
    - jsonPath: .spec.migrationThreshold
      name: Threshold
      type: string
    - jsonPath: .spec.paused
      name: Paused
