{{- if .Values.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubevirt-drs.fullname" . }}-dashboard
  namespace: {{ default .Release.Namespace .Values.dashboard.namespace }}
  labels:
    {{- include "kubevirt-drs.labels" . | nindent 4 }}
    {{- with .Values.dashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
data:
  kubevirt-drs.json: |-
    {{- .Files.Get "dashboards/kubevirt-drs.json" | nindent 4 }}
{{- end }}
