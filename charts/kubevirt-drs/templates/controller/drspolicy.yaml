{{- if and .Values.controller.enabled .Values.policy.create }}
{{- $p := .Values.policy }}
apiVersion: drs.zhanwei.ai/v1alpha1
kind: DRSPolicy
metadata:
  name: default
  labels:
    {{- include "kubevirt-drs.labels" . | nindent 4 }}
spec:
  automationLevel: {{ $p.automationLevel }}
  migrationThreshold: {{ $p.migrationThreshold }}
  cycleInterval: {{ $p.cycleInterval }}
  cooldown:
    base: {{ $p.cooldown.base }}
    max: {{ $p.cooldown.max }}
    historyWindow: {{ $p.cooldown.historyWindow }}
  recommendationTTL: {{ $p.recommendationTTL }}
  watchdog:
    # dig: tolerate values from an older release (helm upgrade --reuse-values) that have no policy.watchdog
    gracePeriod: {{ dig "watchdog" "gracePeriod" "2m" $p }}
    blacklistFor: {{ dig "watchdog" "blacklistFor" "1h" $p }}
  scoreAnnotation: {{ $p.scoreAnnotation }}
  softTainter: {{ $p.softTainter }}
  paused: {{ $p.paused }}
{{- end }}
